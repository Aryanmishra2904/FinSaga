services:

  account-db:
    image: postgres:17

    container_name: account-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: account_db

    ports:
      - "5432:5432"

    volumes:
      - account-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  account-service:
    build:
      context: ./services/account_Services
      dockerfile: Dockerfile

    container_name: account-service

    ports:
      - "3001:3001"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@account-db:5432/account_db
      PORT: 3001

    depends_on:
      account-db:
        condition: service_healthy


volumes:
  account-db-data: